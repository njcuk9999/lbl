# =============================================================================
# activity_lines.yaml: the lines of the literature's activity indicators, from
# u to K, whose equivalent widths LBL measures in every spectrum
# (lbl/science/activity_lines.py, lbl/doc/ACTIVITY.md)
# =============================================================================
# The formalism of Schofer et al. (2019, A&A 623, A44, section 3.2): each line
# has an integration WINDOW (a boxcar) and two PSEUDO-CONTINUUM RANGES, one
# blueward and one redward of it; the template's 90th percentile in each
# range, a straight line between them, is the continuum. Every wavelength
# here is IN VACUUM, in nm, in the star's rest frame.
#
# One entry per line, named by its element and its vacuum wavelength in
# microns, five decimals (He 1.08333). Per line:
#
#   label        the usual name
#   species      element and ionisation stage
#   wave         its centre: NIST ASD (Ritz, from the energy levels), the
#                gA-weighted mean of the components within the line (H I
#                fine structure, the He I triplets). For the labels: the
#                window is what is measured
#   band         photometric band it falls in
#   kind         chromospheric, or flare (lines seen mostly in flares)
#   window       [lo, hi]: the whole line, wide enough for the broadest
#                emission (Schofer et al.)
#   continuum    [[lo, hi], [lo, hi]]: the two pseudo-continuum ranges
#   derived      for a line no study defines: which line's window and ranges
#                its own are made like (see below)
#   ref, url     where the window and the ranges come from
#   note         the published numbers, conversions, cautions
#
# WHERE THEY COME FROM, in this order:
#   1. Schofer et al. 2019, Table 1: lambda0 +- dlambda, the ranges
#      lambda_l/r +- dlambda_PC, in A, vacuum. dlambda is a HALF width.
#   2. another high-resolution study defining a window and ranges for the
#      line (Fuhrmeister et al. 2023 for Pa gamma and delta, Robertson et al.
#      2016 for K I), or a window (iSTARMOD for Ca II H and K and H beta, with
#      the Ca II ranges of Gomes da Silva et al. 2011); a definition in air
#      is brought to vacuum (Morton 2000, the IAU standard) and the note
#      gives the published numbers.
#   3. DERIVED, by maintenance/activity/derive_ranges.py, from the `derived`
#      entry: the WINDOW has the half width in velocity of the window of
#      `window_like` (the closest line of the same species defined in the
#      literature); the RANGES have the half width in velocity of the first
#      range of `ranges_like`, on each side of the window, one half width
#      away at least, within 0.25 % of the centre, where PHOENIX models of
#      3000, 3400 and 3800 K (log g 4.5, R = 70 000) are closest to their
#      upper envelope, and TAPAS stays above 0.95 within +-30 km/s (not
#      checked beyond 1850 nm, the end of LBL's TAPAS file). Two windows
#      that overlap are cut at the midpoint of their lines' centres.
#
# version: changed with any window or range: an lblrv file measured with
# another version is measured again (ACTVERS of its ACTIVITY extension).
#
# Checked: the vacuum centres agree with Schofer et al. 2019 (Table 1) to
# 0.01 A for Na D, H alpha, Ca IRT and Pa beta, and to 0.04 A for He I D3 and
# He I 10830 (their weighting of the components differs); Ca II H and K,
# brought to air (Morton 2000) for the comparison only, agree with the air
# centres of Gomes da Silva et al. 2011 to 0.003 A.
#
# References:
#   NIST Atomic Spectra Database (Kramida, Ralchenko, Reader and the NIST ASD
#     Team), https://doi.org/10.18434/T4W30F (accessed 2026-10-22)
#   Schofer et al. 2019, A&A 623, A44,
#     https://doi.org/10.1051/0004-6361/201834114 (arXiv 1901.08861)
#   Fuhrmeister et al. 2023, A&A 678, A1,
#     https://doi.org/10.1051/0004-6361/202347161 (arXiv 2308.07685)
#   Robertson et al. 2016, ApJ 832, 112,
#     https://doi.org/10.3847/0004-637X/832/2/112 (arXiv 1608.06291)
#   Labarga & Montes 2025, AJ 171, 15 (iSTARMOD),
#     https://doi.org/10.3847/1538-3881/ae173e (arXiv 2512.09192)
#   Gomes da Silva et al. 2011, A&A 534, A30,
#     https://doi.org/10.1051/0004-6361/201116971 (arXiv 1109.0321)
#   Fuhrmeister et al. 2019, A&A 632, A24 (He I 10830 in M dwarfs; the weak
#     component blended), https://doi.org/10.1051/0004-6361/201936193
#   Maldonado et al. 2017, A&A 598, A27 (Balmer windows, width unsaid),
#     https://doi.org/10.1051/0004-6361/201629223
#   Morton 2000, ApJS 130, 403, https://doi.org/10.1086/317349 (air/vacuum)
# =============================================================================
