# =============================================================================
# activity_lines.yaml: the lines of the literature's activity indicators, from
# u to K, whose differential equivalent widths LBL measures in every spectrum
# (lbl/science/activity_lines.py)
# =============================================================================
# One entry per line, named by its element and its VACUUM wavelength in
# microns, five decimals (He 1.08333). Per line:
#
#   label        the usual name
#   species      element and ionisation stage
#   wave         centre [nm], IN VACUUM like every wavelength here: NIST ASD
#                (Ritz, from the energy levels), the gA-weighted mean of the
#                components within the line (H I fine structure, the He I
#                triplets); read 2026-10-22
#   width        width of the measuring window [nm]: the full width of a boxcar,
#                the FWHM of a gaussian
#   function     boxcar or gaussian
#   band         photometric band it falls in
#   kind         chromospheric, or flare (lines seen mostly in flares)
#   width_ref    where the width comes from, or "proposed" (to be discussed)
#   width_url    the paper it comes from
#   note         alternatives and remarks
#
# Checked: the vacuum centres agree with Schofer et al. 2019 (Table 1) to
# 0.01 A for Na D, H alpha, Ca IRT and Pa beta, and to 0.04 A for He I D3 and
# He I 10830 (their weighting of the components differs); Ca II H and K,
# brought to air (Morton 2000) for the comparison only, agree with the air
# centres of Gomes da Silva et al. 2011 to 0.003 A.
#
# References:
#   NIST Atomic Spectra Database (Kramida, Ralchenko, Reader and the NIST ASD
#     Team), https://doi.org/10.18434/T4W30F, queried through
#     https://physics.nist.gov/PhysRefData/ASD/lines_form.html
#   Gomes da Silva et al. 2011, A&A 534, A30,
#     https://doi.org/10.1051/0004-6361/201116971 (https://arxiv.org/abs/1109.0321)
#   Schofer et al. 2019, A&A 623, A44,
#     https://doi.org/10.1051/0004-6361/201834114 (https://arxiv.org/abs/1901.08861)
#   Morton 2000, ApJS 130, 403, https://doi.org/10.1086/317349 (vacuum to air,
#     for the check only)
# =============================================================================
